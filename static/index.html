<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kyra LiDAR Agents</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="/style.css"></head>
<body><header><div class="brand">K</div><div><strong>KYRA</strong><small>LiDAR Agents</small></div><span id="message" role="status"></span></header>
<div class="layout"><aside class="sidebar"><div class="sidehead"><h2>LiDAR Agents</h2><button id="addLidar" title="Add LiDAR">+</button></div><div id="lidars"></div></aside>
<main><nav id="tabs"><button data-tab="scene">Scene</button><button data-tab="lidar">LiDAR</button><button data-tab="mqtt">MQTT</button><button data-tab="map">Map Alignment</button><button data-tab="calibration">Calibration</button><button data-tab="geometry" hidden>Geometry</button><button data-tab="rules">Rules</button><button data-tab="events">Events</button><button id="save" title="Save configuration">Save</button></nav><div id="canvasWrap"><div id="mapBackground"></div><canvas id="scene" width="1200" height="750"></canvas><div class="canvasTools"><button id="pan" title="Pan map">Pan</button><button id="selectTool" title="Select and edit geometry">Select</button><button id="drawLine" title="Draw line" hidden>Line</button><button id="drawPolygon" title="Draw polygon" hidden>Polygon</button><button id="drawRoi" title="Draw ROI">ROI</button><button id="addControl" title="Add map control point">Map point</button><button id="fit" title="Fit scene">Fit</button><button id="zoomIn" title="Zoom in" aria-label="Zoom in">+</button><button id="zoomOut" title="Zoom out" aria-label="Zoom out">−</button></div></div><div id="status"></div></main>
<aside class="inspector"><section id="empty">Select or add a LiDAR agent.</section><section id="lidarPanel" hidden><h2>LiDAR</h2><label>Name<input id="lidarName"></label><label>LiDAR ID<input id="lidarId" disabled></label><label>Source<select id="trackingSource"><option value="Flasheye">Flasheye</option></select></label><label>Sensor ID filter (header.frame_id)<input id="sensorId" placeholder="All frames on this topic"></label><label class="check"><input type="checkbox" id="enabled"> Enabled</label><label>Max track gap (s)<input id="maxGap" type="number" min="0.1" step="0.1"></label><label>Max jump (m)<input id="maxJump" type="number" min="0.1" step="0.1"></label><button id="deleteLidar" class="danger">Delete LiDAR</button></section>
<section id="mqttPanel" hidden><h2>MQTT</h2><label>Host<input id="mqttHost"></label><label>Port<input id="mqttPort" type="number"></label><label>Tracking topic<input id="mqttTopic"></label><label>Username<input id="mqttUser"></label><label>Password<input id="mqttPassword" type="password" placeholder="Use MQTT_PASSWORD environment variable"></label><label>Event topic<input id="mqttEventTopic"></label><label>QoS<select id="mqttQos"><option>0</option><option>1</option><option>2</option></select></label></section>
<section id="mapPanel" hidden><h2>Map Alignment</h2><label>LiDAR latitude<input id="geoLat" type="number" step="any" placeholder="30.400131"></label><label>LiDAR longitude<input id="geoLon" type="number" step="any" placeholder="-84.233054"></label><label>+X heading (degrees)<input id="geoHeading" type="number" step="any" value="0"></label><label>XY origin X<input id="geoOriginX" type="number" step="any" value="0"></label><label>XY origin Y<input id="geoOriginY" type="number" step="any" value="0"></label><label>XY units per meter<input id="geoScale" type="number" min="0.00001" step="any" value="1"></label><label>Y direction<select id="geoYDirection"><option value="left">Left</option><option value="right">Right</option></select></label><button id="applyGeo">Apply map view</button></section>
<section id="calibrationPanel" hidden><h2>Calibration</h2><ol id="calibrationSteps" class="calibrationSteps"></ol><div id="calibrationPrompt" class="calibrationPrompt" role="status"></div><button id="calibrationNext" class="primary"></button><label>Stopped object<select id="captureTrack"><option value="">No live tracks</option></select></label><div class="row"><button id="captureReference">Capture stopped position</button><button id="cancelCapture" hidden>Cancel</button></div><div id="captureStatus" role="status"></div><div id="controlList"></div><button id="addControlRow">+ Control point</button><button id="applyMap">Calculate alignment</button><div id="mapResult"></div></section>
<section id="geometryPanel" hidden><div class="panelHeading"><h2>Geometries</h2><button id="newGeometry" class="primary square" title="Add Geometry">+</button></div><div id="geometryList" class="kyraList"></div><div id="geometryEdit" hidden><h3>Selected Geometry</h3><label>Name<input id="geometryName"></label><label>Type<input id="geometryType" disabled></label><label id="directionLabel">Line Direction<select id="lineDirection"><option value="forward">forward</option><option value="backward">backward</option></select></label><label id="paddingLabel">Endpoint Padding (m)<input id="padding" type="number" step="0.1" min="0" value="0"></label><label id="sensitivityLabel">Crossing Sensitivity (m)<input id="sensitivity" type="number" step="0.05" min="0.05" value="0.35"></label><button id="reverseArrow">Reverse arrow</button><button id="deleteGeometry" class="danger">Delete geometry</button></div></section>
<section id="rulesPanel" hidden><div class="panelHeading"><h2>Rules</h2><button id="addRule" class="primary square" title="New Rule">+</button></div><div id="ruleList" class="kyraList"></div><div id="ruleEdit" hidden><h3>Selected Rule</h3><label>Rule Type<select id="ruleType"><option value="line_crossing">line_crossing</option><option value="zone_transition">zone_transition</option><option value="occupancy">occupancy</option></select></label><label>Name<input id="ruleName"></label><label class="check"><input id="ruleEnabled" type="checkbox"> Enabled</label><label>Classes<div id="ruleClassChoices" class="classChoices"></div></label><label id="ruleRegionLabel">Geometry<select id="ruleRegion"></select></label><div id="sequenceFields"><label>Line 1<select id="ruleLine1"></select></label><label>Line 2<select id="ruleLine2"></select></label><label>Line 3<select id="ruleLine3"></select></label><label>Line Trigger<select id="triggerMode"><option value="any">Any Tagged Line</option><option value="sequence">All Lines In Sequence</option></select></label></div><label>Direction<select id="ruleDirection"><option value="any">Any</option><option value="forward">Forward</option><option value="backward">Backward</option><option value="entering">Enter</option><option value="leaving">Leave</option></select></label><label class="check"><input id="headingEnabled" type="checkbox"> Use Heading Filter</label><div class="row"><button id="headingTool">Adjust Heading On Canvas</button></div><label>Heading Center (deg)<input id="headingCenter" type="number" min="0" max="359.9" step="0.1"></label><label>Heading Deviation (deg)<input id="headingDeviation" type="number" min="5" max="180" step="0.1"></label><label>Min Speed (m/s)<input id="minSpeed" type="number" min="0" step="0.1"></label><label>Track Age (ms)<input id="minAge" type="number" min="0" step="50"></label><label>Debounce (ms)<input id="debounce" type="number" min="0" step="100"></label><label id="occupancyLabel">Occupancy publish interval (ms)<input id="occupancyInterval" type="number" min="100" step="100"></label><input id="ruleClasses" hidden><input id="lineIds" hidden><button id="deleteRule" class="danger">Delete rule</button></div></section>
<section id="eventsPanel" hidden><div class="panelHeading"><h2>Recent Events</h2><button id="resetEvents" class="danger" title="Clear recent events for this LiDAR">Reset</button></div><div id="eventsList"></div></section><section id="scenePanel" hidden><h2>Scene</h2><div id="sceneSummary"></div></section></aside></div><div id="geometryModal" class="modalBackdrop" hidden><div class="modalBox"><h2>Create Geometry</h2><p>Choose the geometry type to draw on the map.</p><div class="row"><button id="chooseLine" class="primary">Line</button><button id="choosePolygon">Polygon</button></div><button id="cancelGeometry">Cancel</button></div></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/app.js"></script><script src="/mapview.js"></script><script src="/kyra-editor.js"></script></body></html>
